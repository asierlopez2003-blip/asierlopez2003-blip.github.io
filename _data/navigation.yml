# Site navigation — header menu order.
#
# Removing a link hides it from the header; the page stays published.
#
# `/expediente/` goes first: it is the complete record and the reason the site
# exists, while `/cv/` is the filtered document built from it. The slug stays
# Spanish; the label is English per the site-language rule.
#
# `/documents/` follows immediately because the PDFs are the most concrete evidence
# on the site, and the two belong together: every document is reachable from the
# record entry it belongs to, and this page is the index of all of them.

main:
  - title: "Academic Record"
    url: /expediente/

  - title: "Documents"
    url: /documents/

  - title: "Publications"
    url: /publications/

  - title: "Talks"
    url: /talks/

  - title: "Portfolio"
    url: /portfolio/

  - title: "Blog"
    url: /year-archive/

  - title: "CV"
    url: /cv/

# Kept out of the menu on purpose:
#
#   /teaching/   — page and collection exist, but a PhD student with no teaching
#                   record should not advertise an empty section. Add when there
#                   is something to show.
