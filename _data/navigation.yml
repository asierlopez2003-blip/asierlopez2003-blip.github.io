# Site navigation — header menu order.
#
# Removing a link hides it from the header; the page stays published.
# `/expediente/` is added in Phase 4, once that page exists — adding it now would
# be a dead link and Jekyll builds with warnings.

main:
  - title: "Publications"
    url: /publications/

  - title: "Talks"
    url: /talks/

  - title: "Portfolio"
    url: /portfolio/

  - title: "Blog"
    url: /year-archive/

  - title: "CV"
    url: /cv/

# Kept out of the menu on purpose:
#
#   /teaching/   — page and collection exist, but a PhD student with no teaching
#                   record should not advertise an empty section. Add when there
#                   is something to show.
#   /cv-json/    — the built-in structured CV. Available at /cv-json/; see
#                   docs/plantilla/campos-cv.md for why it cannot represent
#                   awards, certifications, or grouped education.
