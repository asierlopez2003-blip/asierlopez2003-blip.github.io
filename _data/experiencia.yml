# Research positions, flat and chronological, newest first.
#
# Rendered by `_pages/expediente.html` (Phase 4).
#
# Not grouped, unlike `titulos.yml`: the user asked for *titles* to be categorised by
# domain, and a work history reads better as a timeline.
#
# `ended: present` is the mechanism for the current/finished distinction. The overlap
# between positions is real — CERN runs Jun–Sep 2026 while EUNICE runs from Jun 2026
# onwards, for example. That overlap is innocuous on a single CV page but conspicuous
# in a browsable record, so the status marker is an accuracy requirement rather than a
# design flourish.
#
# `highlights` describes the technical work, taken from the user's own CV variants
# under `~/Desktop/PenDrive/asier/`. Fuller narrative on TFM, JAE and CERN material is
# deferred to Phase 8.
#
# `supervisor` is present where the source CVs record one. It is a single string, not a
# list: `_pages/cv.md` interpolates it directly, and Liquid joins list elements with no
# separator, so a list would print two names run together with no error.
#
# Every entry carries a stable `id`, used by `docs:` to attach public documents from
# `_data/documentos.yml` and rendered as the `id=` anchor on `/expediente/`.

