- id: master-thesis-desy
  title: Experimental determination of Triple Higgs Couplings in the Real Singlet Extension
    of the Standard Model at the HL-LHC
  year: 2026
  kind: MSc thesis
  lang: en
  file: files/master-thesis-desy.pdf
  pages: 55
  bytes: 9335555
  size: 8.9 MB
  summary: Analyzes the real singlet extension of the Standard Model in the parameter space
    that yields a strong first-order electroweak phase transition, the condition under which
    electroweak baryogenesis could account for the observed matter-antimatter asymmetry. Di-Higgs
    production (hh, hH, HH) via gluon fusion at the HL-LHC is computed with anyBSM; the channels
    containing a BSM Higgs are statistically insignificant, leaving hh as the only channel
    with viable sensitivity. A chi-squared fit on sensitive kinematic observables then projects
    the experimental constraints on the trilinear couplings, yielding a first determination
    of lambda_hhH for some benchmark points. Written at DESY under Sven Heinemeyer.

- id: summer-report-cern-nlgad
  title: Characterization of nLGAD sensors from FBK using TCT techniques
  year: 2026
  kind: Research report
  lang: en
  doi: https://doi.org/10.17181/mypnp-4wq78
  record_url: https://repository.cern/records/eybt5-br259
  file: files/summer-report-cern-nlgad.pdf
  pages: 7
  bytes: 1006939
  size: 983 KB
  summary: Characterises nLGAD detectors from several FBK wafers using transient current technique
    measurements, both TPA-TCT and SPA-TCT, to explain the induced signals in different scenarios
    and to establish how the composition of the n-type gain layer affects the gain reduction
    mechanism. nLGADs target low-penetrating particles such as soft X-rays and low-energy
    charged particles for future experiments including the FCC; the gain-layer analysis also
    bears on donor removal in n-type implants, which is central to the compensated LGADs developed
    under the EXFLU and COMPLEX projects. Produced during a CERN Summer Student placement
    in the Solid State Detector group, supervised by Marcos Fernandez Garcia.

- id: bachelor-thesis-unican
  title: Study of the Emission from Broad and Narrow Line Regions of Active Galactic Nuclei
  year: 2025
  kind: BSc thesis
  lang: es
  file: files/bachelor-thesis-unican.pdf
  pages: 72
  bytes: 3018911
  size: 2.9 MB
  summary: Explains the intermediate optical classifications (1.0 to 1.9) of active galactic
    nuclei through a spectroscopic study of their broad and narrow line regions, using a sample
    of 165 X-ray-selected AGN at z < 0.75. Spectra are fitted with PyQSOFit, a Python code
    applying principal component spectral decomposition, and the results are compared against
    preliminary work from Barquin (2024). The intermediate classes are found not to arise
    from changes in intrinsic emission-line fluxes but from reddening of the observed broad
    H-beta flux by extinction in the dusty torus, with systematically higher extinction in
    the narrow line region than in the broad line region. The results are also consistent
    with the Baldwin effect. Written in Spanish; supervised by Diego Herranz Munoz and Silvia
    Mateos Ibanez.
