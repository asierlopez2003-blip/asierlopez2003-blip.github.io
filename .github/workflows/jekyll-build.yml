name: Build and deploy Jekyll site

# The previous version of this file triggered on `workflow_run` for a
# "Cleanup bad PR" workflow that no longer exists in this repository, and had no
# deploy step. A `workflow_run` trigger for a missing workflow never fires, so the
# file could never run at all: the build-time safety net CLAUDE.md describes was
# inert. This version is triggered directly by pushes to the default branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a Pages deployment part-way: an interrupted deploy can leave the
  # published site inconsistent with the repository.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # github-pages 232 resolves to Jekyll 3.10.0 (see Gemfile.lock). Keep this
          # in step with the local Ruby 3.3.8.
          ruby-version: "3.3"
          # Requires a committed Gemfile.lock. It is versioned for this reason:
          # without it, `github-pages` resolves to a different Jekyll remotely
          # than locally, which is exactly the "works on my machine" failure.
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
